name: Release

# Publishes an npm release ONLY from an exact, qualified immutable candidate.
#
# The non-negotiable rule (public-beta audit P2): the 12-hour soak qualifies a
# specific candidate — never rebuild after qualification. This workflow
# therefore refuses to run the toolchain at all.
#
# P0 (qualification transport): the soak runs on the deployment host, and the
# receipts + releases/ tree are deliberately gitignored — a fresh runner
# cannot possess them from a checkout. The qualified candidate therefore
# travels in an immutable bundle (candidate + receipt + manifest digests,
# scripts/release-bundle.mjs create) uploaded to a GitHub Release keyed
# `qualification-<buildId>`. This workflow downloads that exact bundle,
# verifies every digest and the receipt identity, and stages the package from
# the extracted candidate (scripts/package-stage.mjs --skip-build
# --candidate ...) with npm provenance. Any identity mismatch aborts before a
# credential is even loaded.
#
# Prerequisite (one-time, by whoever ran the soak):
#   node scripts/release-bundle.mjs create
#   gh release create qualification-<buildId> --draft --verify \
#       <bundle>.tgz <bundle>.tgz.sha256
#
# Trigger: workflow_dispatch with the candidate buildId, run from the commit
# the candidate was built from.

on:
  workflow_dispatch:
    inputs:
      buildId:
        description: "Immutable candidate buildId (releases/<buildId>) from the qualified beta-qualification.json"
        required: true
      dry-run:
        description: "Stage and verify the package without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  fetch-qualification:
    name: Fetch and verify the qualification bundle
    runs-on: ubuntu-latest
    outputs:
      buildId: ${{ steps.bundle.outputs.buildId }}
      candidate: ${{ steps.bundle.outputs.candidate }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0

      - name: Download the qualification bundle
        env:
          GH_TOKEN: ${{ github.token }}
          KONTROL_RELEASE_BUILD_ID: ${{ inputs.buildId }}
        run: |
          set -euo pipefail
          tag="qualification-${KONTROL_RELEASE_BUILD_ID}"
          mkdir -p .kontrol-qualification
          # The durable store for soak-qualified candidates: a draft GitHub
          # Release tagged qualification-<buildId> carrying the bundle tarball
          # and its sha256 sidecar. Drafts are only visible to maintainers,
          # which is the intended audience for a pre-publication artifact.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "kontrol-qualification-${KONTROL_RELEASE_BUILD_ID}.tgz" \
            --pattern "kontrol-qualification-${KONTROL_RELEASE_BUILD_ID}.tgz.sha256" \
            --dir .kontrol-qualification
          ls -la .kontrol-qualification

      - name: Verify the bundle (digests + receipt identity + candidate closure)
        id: bundle
        env:
          KONTROL_RELEASE_BUILD_ID: ${{ inputs.buildId }}
          # Source-SHA pin: the dispatch must happen from the qualified commit.
          KONTROL_RELEASE_EXPECT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/release-bundle.mjs verify \
            --bundle ".kontrol-qualification/kontrol-qualification-${KONTROL_RELEASE_BUILD_ID}.tgz" \
            --expect-build-id "${KONTROL_RELEASE_BUILD_ID}" \
            --out .kontrol-qualification
          echo "buildId=${KONTROL_RELEASE_BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "candidate=$(pwd)/.kontrol-qualification/bundle/kontrol-qualification-${KONTROL_RELEASE_BUILD_ID}/candidate" >> "$GITHUB_OUTPUT"

      - name: Upload the verified candidate for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-candidate-${{ inputs.buildId }}
          path: .kontrol-qualification/bundle/kontrol-qualification-${{ inputs.buildId }}/candidate
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish qualified candidate to npm
    runs-on: ubuntu-latest
    needs: fetch-qualification
    permissions:
      contents: read
      # npm provenance requires id-token: the workflow's OIDC token is
      # exchanged by the registry to attest the build provenance.
      id-token: write
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      # The publishing job re-verifies the candidate itself and never trusts
      # the prior job's conclusion: the artifact is re-checked against the
      # same bundle digests before staging.
      - name: Download the verified candidate
        uses: actions/download-artifact@95815c38cf2ff2164869cb3775c2e7a8e04b1e28 # v4.2.1
        with:
          name: qualified-candidate-${{ inputs.buildId }}
          path: candidate

      - name: Re-verify the candidate against the qualification bundle
        env:
          GH_TOKEN: ${{ github.token }}
          KONTROL_RELEASE_BUILD_ID: ${{ inputs.buildId }}
          KONTROL_RELEASE_EXPECT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="qualification-${KONTROL_RELEASE_BUILD_ID}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "kontrol-qualification-${KONTROL_RELEASE_BUILD_ID}.tgz" \
            --pattern "kontrol-qualification-${KONTROL_RELEASE_BUILD_ID}.tgz.sha256" \
            --dir .kontrol-qualification
          node scripts/release-bundle.mjs verify \
            --bundle ".kontrol-qualification/kontrol-qualification-${KONTROL_RELEASE_BUILD_ID}.tgz" \
            --expect-build-id "${KONTROL_RELEASE_BUILD_ID}" \
            --out .kontrol-qualification

      - name: Stage package from the verified immutable candidate
        env:
          KONTROL_RELEASE_BUILD_ID: ${{ inputs.buildId }}
        run: node scripts/package-stage.mjs --skip-build --candidate "$GITHUB_WORKSPACE/candidate" --publish-verify-only

      - name: Publish
        if: ${{ inputs.dry-run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          KONTROL_RELEASE_BUILD_ID: ${{ inputs.buildId }}
        run: node scripts/package-stage.mjs --skip-build --candidate "$GITHUB_WORKSPACE/candidate" --publish
