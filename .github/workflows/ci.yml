name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege by default: no job in this workflow needs write access.
# Release publishing (a separate workflow) grants only the scopes it needs.
permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24.x
          - os: ubuntu-latest
            node: 26.x
          - os: macos-latest
            node: 22.19.0
          - os: windows-latest
            node: 22.19.0

    env:
      KONTROL_ALLOWED_ROOTS: ${{ github.workspace }}
      KONTROL_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      KONTROL_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      # Actions are pinned to immutable commit SHAs (version comments kept for
      # maintainability). A remote-code-execution product must not trust
      # mutable tag references on its CI boundary.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium (macOS/Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node scripts/doctor-build.mjs

  # Review P1 #16 / audit P2: the production dependency audit is a security
  # gate, not a per-platform smoke check — it ran once per Linux matrix entry,
  # multiplying advisory noise (and any flaky registry failures) by the matrix.
  # It now runs exactly once on the canonical Node LTS version.
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A security-oriented local execution product does not ship known-
      # moderate runtime advisories. Exceptions require an explicit,
      # documented allowlist (or a documented overrides pin, as with the qs
      # fix) — never a global suppression.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  # P1 #12: stable-release UAT. End-to-end exercise of the INSTALLED product
  # (packed tarball, empty state dir, deterministic fakes — no model/API deps).
  release-uat:
    name: Release UAT (installed product)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.19.0
          cache: npm

      - run: npm ci

      # Build once so the UAT script's staged pack is fast and deterministic.
      - name: Build
        run: npm run build

      - name: Release UAT
        run: npm run uat:release
